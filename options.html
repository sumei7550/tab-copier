<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tab Copier Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main>
    <h1 id="pageTitle"></h1>
    <p id="pageIntro"></p>
    <section>
      <h2 id="copyDefaultsHeading"></h2>
      <label><span id="defaultFormatLabel"></span><select id="defaultFormat"><option value="markdown"></option><option value="urls"></option><option value="titleUrl"></option><option value="html"></option></select></label>
      <label><input type="checkbox" id="defaultAllWindows" /> <span id="defaultAllWindowsLabel"></span></label>
      <label><input type="checkbox" id="excludePinned" /> <span id="excludePinnedLabel"></span></label>
      <label><input type="checkbox" id="removeDuplicates" /> <span id="removeDuplicatesLabel"></span></label>
      <label><input type="checkbox" id="removeTracking" /> <span id="removeTrackingLabel"></span></label>
    </section>
    <section><h2 id="shortcutHeading"></h2><p id="shortcutText"></p><a href="chrome://extensions/shortcuts" id="shortcutLink"></a></section>
    <p id="savedMessage" class="saved" role="status"></p>
  </main>
  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
