<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tab Copier</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="title">
        <img src="icons/icon24.png" alt="" class="title-icon" width="24" height="24" />
        Tab Copier
      </span>
      <button type="button" id="selectAllBtn" class="link-btn"></button>
      <span class="count" id="countLabel"></span>
    </div>
    <p id="pinHint" class="hint" hidden></p><div class="quota-row"><span id="quotaLabel"></span><button id="upgradeBtn" class="link-btn" type="button"></button></div><div class="toolbar"><label for="scopeSelect" id="scopeLabel"></label><select id="scopeSelect"><option value="window"></option><option value="tab"></option><option value="group"></option><option value="all"></option></select></div><p id="groupHint" class="hint" hidden></p><div class="toolbar">
      <label class="format-label" for="formatSelect" id="formatLabel"></label>
      <select id="formatSelect" aria-labelledby="formatLabel">
        <option value="markdown"></option>
        <option value="urls"></option>
        <option value="titleUrl"></option>
        <option value="html"></option>
      </select>
    </div>
    <div class="markdown-style-row" id="markdownStyleRow" hidden>
      <label class="format-label" for="markdownStyleSelect" id="markdownStyleLabel"></label>
      <select id="markdownStyleSelect">
        <option value="plain"></option><option value="bullet"></option>
        <option value="ordered"></option>
        <option value="task"></option>
      </select>
    </div>
    <div class="toolbar"><label><input type="checkbox" id="dedupToggle"><span id="dedupLabel"></span> <small class="pro-tag">Pro</small></label><label id="groupTitleRow" hidden><input type="checkbox" id="includeGroupName"><span id="includeGroupLabel"></span></label></div><p class="hint" id="dedupHelp"></p><div class="filter-row"><input type="search" id="filterInput" autocomplete="off" /></div>
    <div class="tab-list" id="tabList"></div>
    <section class="preview" aria-labelledby="previewHeading">
      <div class="preview-header">
        <span id="previewHeading"></span>
        <button type="button" id="refreshPreviewBtn" class="link-btn"></button>
      </div>
      <div id="previewText" class="preview-content"></div>
    </section>
    <p id="dedupSummary" class="hint" role="status"></p><div class="footer">
      <button id="copyBtn" class="primary-btn">
        <svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span id="copyBtnText"></span>
      </button>
      <div id="toast" class="toast hidden" role="status"></div>
      <button type="button" id="checkPurchaseBtn" class="link-btn"></button><button type="button" id="contactBtn" class="link-btn"></button><a href="options.html" target="_blank" class="settings-link" id="settingsLink"></a>
      <a href="https://ko-fi.com/sumei7550" target="_blank" rel="noopener noreferrer" class="kofi-link" id="coffeeLink">
        ☕ Buy me a coffee
      </a>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="analytics.js"></script>

  <dialog id="proDialog"><h2 id="proTitle"></h2><p id="proDescription"></p><button type="button" id="plansBtn" class="primary-btn"></button><button type="button" id="proClose"></button></dialog>
  <dialog id="supportDialog"><h2 id="supportTitle"></h2><p id="supportIntro"></p><button type="button" id="mailBtn" class="primary-btn"></button><p id="mailHint"></p><p>sumei7550@outlook.com</p><button type="button" id="copyEmailBtn"></button><button type="button" id="copyTemplateBtn"></button><hr><p id="recoveryHint"></p><button type="button" id="restoreBtn"></button><p id="supportStatus" role="status"></p><button type="button" id="supportClose"></button></dialog>
  <script type="module" src="popup.js"></script>
</body>
</html>
